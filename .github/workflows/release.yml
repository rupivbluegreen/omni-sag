name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

jobs:
  verify:
    name: Verify chart appVersion matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart appVersion must equal the release tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -nE 's/^appVersion: *"?([^"]*)"?$/\1/p' deploy/helm/omni-sag/Chart.yaml)
          if [ "$got" != "$want" ]; then
            echo "::error::deploy/helm/omni-sag/Chart.yaml appVersion is \"$got\" but the tag is ${GITHUB_REF_NAME}. The chart's default image tag is .Chart.AppVersion, so a mismatch ships a chart that pulls an image this release never published. Bump appVersion (and the chart version) on master, then re-cut the tag."
            exit 1
          fi
          echo "appVersion ${got} matches ${GITHUB_REF_NAME}"

  release:
    name: Build & publish binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the git-describe version stamp
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross-build every command
        run: |
          set -euo pipefail
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${pair%/*}" GOARCH="${pair#*/}" make binaries
          done
          cd bin && sha256sum * > SHA256SUMS
          echo "== artifacts ==" && ls -1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bin/* \
            --title "Omni-SAG ${GITHUB_REF_NAME}" \
            --generate-notes

  docker:
    name: Build & push Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Helm chart's default image.repository is ghcr.io/<owner>/omni-sag
      # (tag = .Chart.AppVersion), so every release must land there too.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/omni-sag
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: default
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The FIPS variant is the same binary with GODEBUG=fips140=on baked in,
      # published under -fips tags. fips.mode: enforce cannot start without it.
      - name: Derive FIPS image tags
        id: meta-fips
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/omni-sag
            ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-fips,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push FIPS variant (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: fips
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-fips.outputs.tags }}
          labels: ${{ steps.meta-fips.outputs.labels }}
