image:
  repository: ghcr.io/rupivbluegreen/omni-sag
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# FIPS-readiness posture. See docs/fips.md.
#
# mode: "off" (default) | "warn" | "enforce". QUOTE IT — YAML reads a bare
# off/on as a boolean, and the chart refuses to render if it is not a string.
#
# "enforce" makes the gateway refuse to start unless its process is in FIPS
# mode, which only the -fips image variant is (it sets GODEBUG=fips140=on).
# The chart therefore appends the -fips suffix to the image tag by itself
# whenever mode is "enforce", so the config and the image cannot drift apart
# and crash-loop. useFipsImage overrides that decision in either direction:
# set it true to run the FIPS image under warn/off (a valid posture — the
# variant runs every mode), or false to state deliberately that the image is
# already FIPS by other means. enforce + useFipsImage: false is refused.
#
# When configSecretName is set, this chart renders no config at all, so mode
# here selects ONLY the image — set fips.mode in your own config to match.
fips:
  mode: "off"
  useFipsImage: null   # null ⇒ derived from mode ("enforce" ⇒ true)

# Default 1: with >1 replica behind one SSH LoadBalancer, each pod mints its own
# ephemeral host key (host_key lives on the per-pod writable volume), so a client
# reconnecting to a different pod hits a host-key mismatch and refuses to connect.
# For replicaCount > 1 you MUST provision a SHARED SSH host key: put it in the
# Secret named by configSecretName (mounted read-only at /etc/omni-sag) and set
# `host_key: /etc/omni-sag/hostkey.pem` in the gateway config so every replica
# presents one stable identity.
replicaCount: 1      # sessions drain on rolling upgrade; see note for HA (>1)

# Rolling-upgrade drain. terminationGracePeriodSeconds must exceed the gateway's
# drain_grace_seconds so in-flight SSH sessions can finish before SIGKILL.
drainGraceSeconds: 30
terminationGracePeriodSeconds: 45

ports:
  ssh: 2222
  api: 8443
  metrics: 9090
  sshTLS: 2223  # SSH-over-TLS data-path port (container-side, unprivileged).
                # Only opened when gatewayTLS.enabled (see below).

# Raw-TCP SSH ingress. Use LoadBalancer (MetalLB / cloud LB) for real ingress.
# If gatewayTLS.route.enabled fronts this gateway externally, this Service's
# LoadBalancer is no longer required for THAT path — the Route/router handles
# external exposure of the TLS listener. You can switch `type` to ClusterIP
# once the Route is live and confirmed working, but the chart does not do
# this for you: plain SSH (ports.ssh) would then only be reachable in-cluster
# / via kubectl port-forward / break-glass — decide deliberately based on
# your own fallback-access requirements, don't flip this reflexively.
sshService:
  type: LoadBalancer
  port: 22
  # loadBalancerIP: ""    # pin if your LB supports it

apiService:
  type: ClusterIP

metrics:
  enabled: true
  # A ServiceMonitor is out of scope here; scrape :9090/metrics.

# The gateway config is templated into a ConfigMap. Secrets (bind passwords,
# shared secrets, TLS, signing keys) belong in a Secret referenced here — do NOT
# put them in values in production.
configSecretName: ""   # optional Secret mounted at /etc/omni-sag alongside config

# SSH-over-TLS data path ("TLS Routing"): wraps a SECOND listener (ports.sshTLS)
# in TLS so an SNI-aware L4 router can pick this backend from the ClientHello
# before any SSH bytes are sent — e.g. an OpenShift Route with
# `spec.tls.termination: passthrough`. The existing plain-SSH listener
# (ports.ssh / sshService) keeps serving unmodified alongside it; this is
# purely additive, never a replacement. See docs/openshift-tls-routing.md for
# the client-side `ssh -o ProxyCommand=...` invocation.
#
# NOTE: if configSecretName is set, the chart's bootstrap ConfigMap (and the
# `tls:` stanza it generates below) is NOT rendered at all — you must
# hand-author the equivalent `tls:` block in your own config, pointing at the
# same mount path (/etc/omni-sag/tls/tls.crt, tls.key[, ca.crt]) this chart
# mounts from certSecretName.
gatewayTLS:
  enabled: false

  # Secret of type kubernetes.io/tls (keys: tls.crt, tls.key), mounted
  # read-only at /etc/omni-sag/tls. Required when gatewayTLS.enabled is true;
  # the chart never generates or manages this material — bring your own,
  # same convention as configSecretName.
  certSecretName: ""

  # When true, also expects a `ca.crt` key in certSecretName and sets
  # `tls.client_ca` in the templated config, requiring mutual TLS (client
  # certificates) on the SSH-over-TLS listener only — the plain-SSH listener
  # is never affected by this setting.
  clientCAEnabled: false

  route:
    # Renders an OpenShift Route (route.openshift.io/v1, passthrough
    # termination) fronting the SSH-over-TLS port. OpenShift-only API — leave
    # this false on plain Kubernetes. If left true where the route.openshift.io
    # CRD isn't present, the template refuses to render with a clear error
    # instead of emitting a Route the API server would reject.
    enabled: false
    host: ""  # e.g. gateway.apps.cluster.example.com; empty ⇒ OpenShift assigns one
    annotations: {}
      # The OpenShift router's default idle timeout WILL cut long-lived/idle
      # SSH sessions and -L tunnels riding this Route unless raised, e.g.:
      # haproxy.router.openshift.io/timeout: "1h"

# restricted-v2 / ADR-0001 compatible pod security. No IPC_LOCK, no privilege,
# read-only rootfs, seccomp RuntimeDefault, non-root. Swap-off is a NODE
# requirement (kubelet failSwapOn / node config), not settable here.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 0
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Writable ephemeral dirs (rootfs is read-only): host key, evidence data_dir,
# approval store. Back with a PVC in production for durable evidence/approvals.
persistence:
  enabled: false
  size: 5Gi
  storageClass: ""
