{{- if and .Values.gatewayTLS.enabled .Values.gatewayTLS.route.enabled }}
{{- if not (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
{{- fail "gatewayTLS.route.enabled requires the OpenShift Route API (route.openshift.io/v1), which is not available on this cluster/API server. Disable gatewayTLS.route.enabled on plain Kubernetes." }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "omni-sag.fullname" . }}-ssh
  labels: {{- include "omni-sag.labels" . | nindent 4 }}
  {{- with .Values.gatewayTLS.route.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gatewayTLS.route.host }}
  host: {{ .Values.gatewayTLS.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "omni-sag.fullname" . }}-ssh
  port:
    targetPort: sshtls
  tls:
    termination: passthrough
  wildcardPolicy: None
{{- end }}
