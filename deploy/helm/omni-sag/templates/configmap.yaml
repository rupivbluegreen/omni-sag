{{- include "omni-sag.validateFips" . -}}
{{- if not .Values.configSecretName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omni-sag.fullname" . }}-config
  labels: {{- include "omni-sag.labels" . | nindent 4 }}
data:
  config.yaml: |
    # NOTE: this default config is for bootstrap/dev. In production supply a
    # Secret via .Values.configSecretName so bind passwords / shared secrets /
    # TLS keys are not stored in a ConfigMap.
    listen: ":{{ .Values.ports.ssh }}"
    host_key: "/var/lib/omni-sag/hostkey.pem"
    drain_grace_seconds: {{ .Values.drainGraceSeconds }}
    api:
      listen: ":{{ .Values.ports.api }}"
    {{- if .Values.metrics.enabled }}
    metrics:
      listen: ":{{ .Values.ports.metrics }}"
    {{- end }}
    {{- if .Values.gatewayTLS.enabled }}
    # Mirrors gatewayTLS.* in values.yaml, for the bootstrap/dev config only.
    # Production configs supplied via configSecretName are NOT rendered by
    # this ConfigMap at all — hand-author the equivalent `tls:` block there.
    tls:
      listen: ":{{ .Values.ports.sshTLS }}"
      cert: "/etc/omni-sag/tls/tls.crt"
      key: "/etc/omni-sag/tls/tls.key"
      {{- if .Values.gatewayTLS.clientCAEnabled }}
      client_ca: "/etc/omni-sag/tls/ca.crt"
      {{- end }}
    {{- end }}
    {{- if ne .Values.fips.mode "off" }}
    # Kept in step with the image by the chart: "enforce" only boots on the
    # -fips variant, which omni-sag.image selects automatically.
    fips:
      mode: {{ .Values.fips.mode | quote }}
    {{- end }}
    evidence:
      pipeline:
        data_dir: "/var/lib/omni-sag/evidence"
        signing_key: "/var/lib/omni-sag/evidence-key.pem"
    policy:
      roles: []
{{- end }}
